[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perceptual-harmony"
dynamic = ["version"]
description = "Check colour palettes for hue harmony (Cohen-Or et al. 2006 templates) in perceptual colour spaces, with contrast, colour-vision deficiency checks and suggestions."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matteo Niccoli"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["colour", "color", "harmony", "palette", "perceptual", "oklch", "cielab", "cam02-ucs", "cam16-ucs", "accessibility", "visualization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/mycarta/perceptual-harmony"
Source = "https://github.com/mycarta/perceptual-harmony"
Issues = "https://github.com/mycarta/perceptual-harmony/issues"

[project.optional-dependencies]
dev = ["pytest", "colorspacious", "numpy"]

[project.scripts]
perceptual-harmony = "perceptual_harmony.cli:main"

[tool.setuptools.dynamic]
version = {attr = "perceptual_harmony.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
