<text x="28" y="390" fill="#1f2328" font-size="14" font-weight="600">Closest pairs</text>
<text x="28" y="414" fill="#1f2328" font-size="13">protanopia: sky-light / lavender, dE 0.028 (normal vision 0.103) — close</text>
<text x="28" y="438" fill="#1f2328" font-size="13">deuteranopia: sky-light / lavender, dE 0.072 (normal vision 0.103)</text>
<text x="28" y="462" fill="#1f2328" font-size="13">tritanopia: sky-blue / green-dark, dE 0.069 (normal vision 0.249)</text>
