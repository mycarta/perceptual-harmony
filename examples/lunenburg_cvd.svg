<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="640" height="512" fill="#ffffff"/>
<text x="28" y="40" fill="#1f2328" font-size="22" font-weight="600">Lunenburg event palette, simulated dichromacy</text>
<text x="28" y="64" fill="#57606a" font-size="13">Dichromacy simulated as in Machado, Oliveira &amp; Fernandes (2009).</text>
<text x="246" y="96" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">normal</text>
<text x="350" y="96" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">protanopia</text>
<text x="454" y="96" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">deuteranopia</text>
<text x="558" y="96" fill="#1f2328" font-size="13" font-weight="600" text-anchor="middle">tritanopia</text>
<text x="28" y="125" fill="#1f2328" font-size="14" font-weight="400" dominant-baseline="central">sky-blue</text>
<rect x="200" y="108" width="92" height="34" rx="5" fill="#4e7fcc" stroke="#d0d7de"/>
